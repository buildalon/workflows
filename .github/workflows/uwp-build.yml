# Builds unity project and creates UWP package for sideloading or store submission
name: Buildalon UWP Build
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: ['**']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      clean:
        description: 'Cleans the library folder and deletes cached items'
        required: false
        default: false
        type: 'boolean'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{(github.event_name == 'pull_request' || github.event.action == 'synchronize')}}
jobs:
  build:
    name: (${{ matrix.os }}) ${{ matrix.build-target }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
    env:
      UNITY_PROJECT_PATH: ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: buildalon-windows
            build-target: WSAPlayer
            build-args: ''
    steps:
      - uses: actions/checkout@v7
        with:
          clean: ${{ inputs.clean }}
      - uses: buildalon/unity-setup@v2
        with:
          version-file: ${{ github.workspace }}/ProjectSettings/ProjectVersion.txt
          build-targets: ${{ matrix.build-target }}
      - uses: buildalon/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}
          # required for Professional license activations
          # serial: ${{ secrets.UNITY_SERIAL }}
      - uses: buildalon/unity-action@v3
        name: ${{ matrix.build-target }}-Validate
        with:
          build-target: ${{ matrix.build-target }}
          log-name: ${{ matrix.build-target }}-Validate
          args: -quit -nographics -batchmode -executeMethod Buildalon.Editor.BuildPipeline.UnityPlayerBuildTools.ValidateProject
      - name: Clean ${{ matrix.build-target }} Build Output
        shell: pwsh
        env:
          BUILD_OUTPUT_PATH: ${{ env.UNITY_PROJECT_PATH }}/Builds/${{ matrix.build-target }}
        run: |
          $projectPath = [System.IO.Path]::GetFullPath($env:UNITY_PROJECT_PATH).TrimEnd([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar)
          $projectRoot = "$projectPath$([System.IO.Path]::DirectorySeparatorChar)"
          $outputPath = [System.IO.Path]::GetFullPath($env:BUILD_OUTPUT_PATH)

          if (!$outputPath.StartsWith($projectRoot, [System.StringComparison]::OrdinalIgnoreCase))
          {
            throw "Refusing to clean build output outside project path: $outputPath"
          }

          if (Test-Path -LiteralPath $outputPath)
          {
            Remove-Item -LiteralPath $outputPath -Recurse -Force
          }

          New-Item -ItemType Directory -Path $outputPath -Force | Out-Null
      - uses: buildalon/unity-action@v3
        name: ${{ matrix.build-target }}-Build
        with:
          build-target: ${{ matrix.build-target }}
          log-name: ${{ matrix.build-target }}-Build
          args: -quit -nographics -batchmode -executeMethod Buildalon.Editor.BuildPipeline.UnityPlayerBuildTools.StartCommandLineBuild -arch ARM64
      - uses: actions/setup-dotnet@v6
      - uses: microsoft/setup-msbuild@v3
      - uses: buildalon/unity-uwp-builder@v1
        id: uwp-build
        with:
          project-path: ${{ env.UNITY_PROJECT_PATH }}/Builds/WSAPlayer
          package-type: 'sideload'
      - name: print outputs
        shell: bash
        run: |
          echo "Executable: ${{ steps.uwp-build.outputs.executable }}"
          echo "Output Directory: ${{ steps.uwp-build.outputs.output-directory }}"
          ls -R "${{ steps.uwp-build.outputs.output-directory }}"
      - uses: actions/upload-artifact@v7
        id: upload-artifact
        name: Upload ${{ matrix.build-target }} Build
        if: success()
        with:
          retention-days: 1
          name: ${{ github.run_number }}.${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.build-target }}-Build
          path: ${{ steps.uwp-build.outputs.output-directory }}
      - uses: actions/upload-artifact@v7
        id: upload-logs
        name: Upload ${{ matrix.build-target }} Logs
        if: always()
        continue-on-error: true
        with:
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
          name: ${{ github.run_number }}.${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.build-target }}-Logs
          path: |
            ${{ github.workspace }}/**/*.log
            ${{ github.workspace }}/**/*.xml
      - name: Clean Artifacts
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set -xe
          echo "Cleaning logs..."
          logs=$(find "${{ github.workspace }}" -type f -name "*.log")
          echo "Found $(echo "$logs" | grep -v '^[[:space:]]*$' | wc -l) log files."
          for log in $logs; do
            if [ ! -s "$log" ]; then
              continue
            fi
            echo "$log"
            rm -f "$log" || echo "::warning::Failed to delete log file: $log"
          done

          clean='${{ inputs.clean }}'
          if [ "$clean" == 'true' ]; then
            echo "Cleaning build artifacts..."
            artifacts="${{ env.UNITY_PROJECT_PATH }}/Builds/${{ matrix.build-target }}"
            echo "Build artifacts path $artifacts"
            if [ -d "$artifacts" ]; then
              items=$(find "$artifacts" -type f)
              echo "Found artifacts folder with $(echo "$items" | grep -v '^[[:space:]]*$' | wc -l) items."
              for item in $items; do
                if [ ! -s "$item" ]; then
                  continue
                fi
                echo "$item"
                rm -rf "$item" || echo "::warning::Failed to delete artifacts folder file: $item"
              done
            else
              echo "Artifacts folder not found."
            fi
            rm -rf "${artifacts}" || echo "::warning::Failed to delete artifacts folder: $artifacts"
          fi

          find "${{ env.UNITY_PROJECT_PATH }}" -type d -empty -delete || echo "::warning::Failed to delete some empty directories"
