# Builds unity project and creates iOS and Android executables for sideloading.
name: Buildalon Mobile Build
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: ['**']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      clean:
        description: 'Cleans the library folder and deletes cached items'
        required: false
        default: false
        type: 'boolean'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{(github.event_name == 'pull_request' || github.event.action == 'synchronize')}}
jobs:
  build:
    name: (${{ matrix.os }}) ${{ matrix.build-target }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
    env:
      UNITY_PROJECT_PATH: ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: buildalon-windows
            build-target: Android
            build-args: ''
          - os: buildalon-macos
            build-target: iOS
            build-args: ' -enableAppleAutomaticSigning'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: ${{ inputs.clean }}
      - uses: buildalon/unity-setup@v2
        with:
          build-targets: ${{ matrix.build-target }}
      - uses: buildalon/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}
          # required for Professional license activations
          # serial: ${{ secrets.UNITY_SERIAL }}
      - uses: buildalon/unity-action@v3
        name: Project Validation
        with:
          log-name: project-validation
          args: -quit -batchmode -executeMethod Buildalon.Editor.BuildPipeline.UnityPlayerBuildTools.ValidateProject
      - name: Clean ${{ matrix.build-target }} Build Output
        shell: pwsh
        env:
          BUILD_OUTPUT_PATH: ${{ env.UNITY_PROJECT_PATH }}/Builds/${{ matrix.build-target }}
        run: |
          $projectPath = [System.IO.Path]::GetFullPath($env:UNITY_PROJECT_PATH).TrimEnd([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar)
          $projectRoot = "$projectPath$([System.IO.Path]::DirectorySeparatorChar)"
          $outputPath = [System.IO.Path]::GetFullPath($env:BUILD_OUTPUT_PATH)

          if (!$outputPath.StartsWith($projectRoot, [System.StringComparison]::OrdinalIgnoreCase))
          {
            throw "Refusing to clean build output outside project path: $outputPath"
          }

          if (Test-Path -LiteralPath $outputPath)
          {
            Remove-Item -LiteralPath $outputPath -Recurse -Force
          }

          New-Item -ItemType Directory -Path $outputPath -Force | Out-Null
      - uses: buildalon/unity-action@v3
        name: ${{ matrix.build-target }}-Build
        with:
          log-name: ${{ matrix.build-target }}-Build
          build-target: ${{ matrix.build-target }}
          args: -quit -batchmode -executeMethod Buildalon.Editor.BuildPipeline.UnityPlayerBuildTools.StartCommandLineBuild${{ matrix.build-args }}
      - uses: buildalon/unity-xcode-builder@v1
        if: matrix.build-target == 'iOS'
        with:
          export-option: debugging
          project-path: ${{ env.UNITY_PROJECT_PATH }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          app-store-connect-key: ${{ secrets.APP_STORE_CONNECT_KEY }}
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      - uses: actions/upload-artifact@v7
        id: upload-artifact
        name: Upload ${{ matrix.build-target }} Build
        if: success()
        with:
          compression-level: 0
          retention-days: 1
          name: ${{ github.run_number }}.${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.build-target }}-Build
          path: |
            ${{ github.workspace }}/**/*.ipa
            ${{ github.workspace }}/**/*.apk
            ${{ github.workspace }}/**/*.aab
            ${{ github.workspace }}/**/*.obb
      - uses: actions/upload-artifact@v7
        id: upload-logs
        name: Upload ${{ matrix.build-target }} Logs
        if: always()
        continue-on-error: true
        with:
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
          name: ${{ github.run_number }}.${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.build-target }}-Logs
          path: |
            ${{ github.workspace }}/**/*.log
            ${{ github.workspace }}/**/*.xml
      - name: Clean Artifacts
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set -xe
          echo "Cleaning logs..."
          logs=$(find "${{ github.workspace }}" -type f -name "*.log")
          echo "Found $(echo "$logs" | grep -v '^[[:space:]]*$' | wc -l) log files."
          for log in $logs; do
            if [ ! -s "$log" ]; then
              continue
            fi
            echo "$log"
            rm -f "$log" || echo "::warning::Failed to delete log file: $log"
          done

          clean='${{ inputs.clean }}'
          if [ "$clean" == 'true' ]; then
            echo "Cleaning build artifacts..."
            artifacts="${{ env.UNITY_PROJECT_PATH }}/Builds/${{ matrix.build-target }}"
            echo "Build artifacts path $artifacts"
            if [ -d "$artifacts" ]; then
              items=$(find "$artifacts" -type f)
              echo "Found artifacts folder with $(echo "$items" | grep -v '^[[:space:]]*$' | wc -l) items."
              for item in $items; do
                if [ ! -s "$item" ]; then
                  continue
                fi
                echo "$item"
                rm -rf "$item" || echo "::warning::Failed to delete artifacts folder file: $item"
              done
            else
              echo "Artifacts folder not found."
            fi
            rm -rf "${artifacts}" || echo "::warning::Failed to delete artifacts folder: $artifacts"
          fi

          find "${{ env.UNITY_PROJECT_PATH }}" -type d -empty -delete || echo "::warning::Failed to delete some empty directories"
